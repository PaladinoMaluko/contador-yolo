[project]
name = "contador-yolo"
version = "0.1.0"
description = "Contagem de veículos em vídeo com YOLO e tracking"
requires-python = ">=3.10"
dependencies = [
    "ultralytics",
    "fastapi",
    "uvicorn",
    "python-multipart",
]
[project.scripts]
contador = "contador.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]